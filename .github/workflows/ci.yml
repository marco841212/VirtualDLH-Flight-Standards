name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: npm test

      - name: Build Stratos plugin
        run: npm run build:plugin

      - name: Create Skyvex upload bundle
        run: |
          rm -f bundle.zip
          cd dist
          zip -r ../bundle.zip .
          cd ..
          unzip -l bundle.zip

      - name: Upload Skyvex bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtualdlh-stratos-v1.0.3
          path: bundle.zip
          if-no-files-found: error
          retention-days: 30
